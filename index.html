<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EWC PC Inventory</title>
<style>
:root{--bg:#0e1014;--panel:#161920;--panel2:#1d2129;--line:#2a2f3a;--txt:#e8eaef;--mut:#8a92a2;--acc:#d9f53a;--accTxt:#141600;--red:#ff5a5f;--amber:#ffb020;--green:#3ecf8e;--blue:#5aa9ff;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:10px 18px;background:rgba(14,16,20,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.04em}
.logo .tape{background:var(--acc);color:var(--accTxt);padding:2px 10px;transform:rotate(-2deg);font-family:"Comic Sans MS","Marker Felt",cursive;font-size:15px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;padding:7px 12px;border-radius:8px;color:var(--mut);cursor:pointer;font-weight:600}
nav button:hover{color:var(--txt);background:var(--panel2)}
nav button.on{color:var(--accTxt);background:var(--acc)}
.sync{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.dot.ok{background:var(--green)}.dot.demo{background:var(--amber)}.dot.err{background:var(--red)}.dot.busy{background:var(--blue);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
main{padding:18px;max-width:1500px;margin:0 auto}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:#3a4150}
.btn.pri{background:var(--acc);color:var(--accTxt);border-color:var(--acc)}
.btn.danger{color:var(--red)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
input[type=text],input[type=number],input[type=url],input[type=password],input:not([type]),select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:60px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut);font-weight:600}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .grow{flex:1;min-width:200px}
.toolbar select{width:auto;min-width:130px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.muted{color:var(--mut)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.03em;background:var(--panel2);color:var(--mut);border:1px solid var(--line)}
.pill.OK{color:var(--green);border-color:rgba(62,207,142,.35)}
.pill.DEAD{background:var(--acc);color:var(--accTxt);border-color:var(--acc)}
.pill.Service,.pill.Serwis{color:var(--amber);border-color:rgba(255,176,32,.35)}
.pill.Spare,.pill.Zapas{color:var(--blue);border-color:rgba(90,169,255,.35)}
/* table */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:700;cursor:pointer;user-select:none;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panel2)}
tbody tr.sel{background:rgba(217,245,58,.06)}
td.name{font-weight:700}
td.chk,th.chk{width:34px}
input[type=checkbox]{accent-color:var(--acc);width:16px;height:16px}
.empty{padding:40px;text-align:center;color:var(--mut)}
.selbar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel2);border-radius:var(--r) var(--r) 0 0;flex-wrap:wrap}
@media(max-width:760px){
  thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tbody tr{display:grid;grid-template-columns:30px 1fr auto;gap:2px 8px;padding:10px;border-bottom:1px solid var(--line)}
  td{border:0;padding:0}
  td.chk{grid-row:span 3}
  td.hide-m{display:none}
  td.st{grid-column:3;grid-row:1}
}
/* racks */
.stage{margin-bottom:22px}
.stage h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin:0 0 10px}
.racks{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.rack{padding:0;overflow:hidden}
.rack .rh{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:800}
.unit{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid #20242d;cursor:pointer}
.unit:last-child{border-bottom:0}
.unit:hover{background:var(--panel2)}
.unit .slot{width:28px;color:var(--mut);font-size:11px;font-variant-numeric:tabular-nums}
.unit .nm{font-weight:700;flex:1}
.unit .gpu{color:var(--mut);font-size:12px}
.unit.dead{background:repeating-linear-gradient(-45deg,rgba(217,245,58,.07) 0 10px,transparent 10px 20px)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto}
.modal{width:100%;max-width:760px;padding:0}
.modal .mh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal .mh h3{margin:0;font-size:17px}
.modal .mb{padding:18px}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal .mf .left{margin-right:auto;display:flex;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.x{background:none;border:0;color:var(--mut);font-size:22px;cursor:pointer;line-height:1}
.qrbox{background:#fff;padding:14px;border-radius:8px;width:260px;height:260px;margin:0 auto}
.qrbox svg{width:100%;height:100%;display:block}
pre.spec{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;white-space:pre-wrap;font-size:12px;max-height:180px;overflow:auto}
/* toast */
#toasts{position:fixed;bottom:16px;right:16px;z-index:90;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--acc);padding:10px 14px;border-radius:8px;max-width:360px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.toast.err{border-left-color:var(--red)}
/* label editor */
.ed{display:grid;grid-template-columns:260px minmax(0,1fr) 280px;gap:14px;align-items:start}
.ed>*{min-width:0}
.stagewrap{overflow:auto}
@media(max-width:1150px){.ed{grid-template-columns:1fr}}
.side{padding:14px;display:flex;flex-direction:column;gap:12px}
.side h4{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.row{display:flex;gap:8px;align-items:flex-end}
.row>*{flex:1}
.stagewrap{padding:24px;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:360px;justify-content:center;background:
  radial-gradient(circle,#262b35 1px,transparent 1px) 0 0/16px 16px,var(--panel)}
.canvasHold{position:relative}
.ellist{display:flex;flex-direction:column;gap:4px;max-height:260px;overflow:auto}
.ellist .it{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent;font-size:12px}
.ellist .it:hover{background:var(--panel2)}
.ellist .it.on{border-color:var(--acc);background:rgba(217,245,58,.06)}
.ellist .it .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ellist .ty{font-size:10px;font-weight:800;color:var(--mut);width:28px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);cursor:pointer}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;background:var(--bg);border:0;padding:6px;cursor:pointer;color:var(--mut);font-weight:700}
.seg button.on{background:var(--panel2);color:var(--acc)}
/* label rendering (shared screen + print) */
.label{position:relative;background:#fff;color:#000;overflow:hidden;font-family:Arial,Helvetica,sans-serif;flex:none}
.label .el{position:absolute;display:flex;overflow:hidden;line-height:1.1;white-space:pre-line;word-break:break-word}
.label .el.qr svg{width:100%;height:100%;display:block}
.edit .label .el{cursor:move;outline:1px dashed rgba(0,0,0,.18)}
.edit .label .el.on{outline:1.5px solid #3b82f6;z-index:5}
.edit .label .el .hdl{position:absolute;right:0;bottom:0;width:9px;height:9px;background:#3b82f6;cursor:nwse-resize}
.edit .label .el:not(.on) .hdl{display:none}
.zoomrow{display:flex;gap:8px;align-items:center;color:var(--mut);font-size:12px}
#printArea{display:none}
.addgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
@media(max-width:1000px){.addgrid{grid-template-columns:1fr}}
.side2{display:flex;flex-direction:column;gap:14px;position:sticky;top:70px}
.topf{padding:14px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.modebar{display:flex;align-items:center;gap:8px}
.csec{padding:12px 14px;margin-bottom:10px}
.csec .ch{display:flex;gap:10px;align-items:baseline;margin-bottom:8px}
.csec .ch b{font-size:13px;min-width:120px}
.csec .cv{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.tile{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 11px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;gap:8px;align-items:center;text-align:left}
.tile:hover{border-color:#4a5262}
.tile.on{background:var(--acc);color:var(--accTxt);border-color:var(--acc)}
.tile .cnt{font-size:10px;background:rgba(255,255,255,.08);border-radius:999px;padding:0 6px;color:var(--mut)}
.tile.on .cnt{background:rgba(0,0,0,.15);color:var(--accTxt)}
.tile.none{color:var(--mut);font-weight:500}
.tile.add{border-style:dashed;color:var(--acc);font-weight:600}
.ramrow{display:flex;gap:10px;margin-top:10px;align-items:flex-end;flex-wrap:wrap}
.ramrow .f{flex:0 0 110px}
.ramsum{font-weight:800;font-size:18px;padding-bottom:6px;color:var(--acc)}
.step{display:flex;gap:4px}.step button{width:34px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;cursor:pointer;font-weight:800}
.step input{width:60px;text-align:center}
.savebar{position:sticky;bottom:10px;display:flex;gap:8px;padding:10px 12px;box-shadow:0 -6px 24px rgba(0,0,0,.35);z-index:5}
.rc{display:flex;gap:8px;align-items:center;padding:6px 4px;border-bottom:1px solid #20242d;cursor:pointer;font-size:13px}
.rc:hover{background:var(--panel2)}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;align-items:start}
.part .rh{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:800}
.part .unit{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid #20242d;cursor:pointer;font-size:13px}
.part .unit:hover{background:var(--panel2)}
.part .unit .nm{flex:1}
.part .unit .gpu{color:var(--mut);font-size:11px;white-space:nowrap}
.who{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--txt)}
.by{font-size:11px;color:var(--mut);white-space:nowrap}
.by.fresh{color:var(--blue);font-weight:700}
tr.fresh td{animation:fl 2.5s ease-out}
@keyframes fl{0%{background:rgba(90,169,255,.25)}100%{background:transparent}}
.diff{width:100%;border-collapse:collapse;margin-top:8px}
.diff td,.diff th{border-bottom:1px solid var(--line);padding:6px 8px;font-size:12px;cursor:default;text-transform:none;letter-spacing:0}
.diff .mine{color:var(--acc)}.diff .theirs{color:var(--blue)}
.brow{display:grid;grid-template-columns:22px 110px 1fr;gap:8px;align-items:center;padding:4px 0}
.brow label{font-size:12px;font-weight:600;color:var(--mut)}
.brow.on label{color:var(--acc)}
.cbgrid{display:flex;flex-wrap:wrap;gap:6px 14px}
.cbgrid label{display:flex;gap:6px;align-items:center;font-size:12px;cursor:pointer}
.sheetPrev{background:#2a2f3a;border-radius:8px;padding:10px;height:330px;overflow:auto}
.sheetPrev .scale{transform:scale(.42);transform-origin:0 0}
/* kartka racka */
.rs{background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;width:190mm;padding:0}
.rs.land{width:277mm}
.rs-h{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1mm solid #000;padding-bottom:2mm;margin-bottom:4mm}
.rs-stage{font-size:11pt;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.rs-rack{font-size:22pt;font-weight:900;text-transform:uppercase;line-height:1.05}
.rs-meta{font-size:9pt;text-align:right}
.rs-t{width:100%;border-collapse:collapse}
.rs-t th,.rs-t td{border:0.25mm solid #000;padding:1.6mm 2mm;font-size:9.5pt;color:#000;text-align:left;vertical-align:middle;cursor:default;text-transform:none;letter-spacing:0;font-weight:400}
.rs-t th{background:#e9e9e9;font-size:8pt;font-weight:800;text-transform:uppercase}
.rs-t td.nm{font-weight:800}
.rs-t tr.dead td{background:#d9f53a}
.rs-t td.qrc{width:15mm;height:15mm;padding:1mm}
.rs-t td.qrc svg{width:13mm;height:13mm;display:block}
.rs-t tr.blank td{height:8mm}
.rs-f{margin-top:5mm;font-size:9pt}
.rs-f .ln{border-bottom:0.25mm solid #000;height:7mm}
@media print{
  html,body{background:#fff!important}
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block;position:absolute;left:0;top:0}
  #printArea.sheet{display:flex;flex-wrap:wrap;gap:2mm}
  #printArea.roll .label{page-break-after:always;break-after:page}
  #printArea .rs+.rs{break-before:page;page-break-before:always}
  #printArea .rs-t tr{break-inside:avoid}
  #printArea .rs *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printArea .label{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  header,main,#toasts,.ov{display:none!important}
}
.help ol{padding-left:18px}.help li{margin:6px 0}
code{background:var(--bg);padding:1px 6px;border-radius:5px;border:1px solid var(--line);font-size:12px}
.banner{padding:10px 14px;border:1px solid rgba(255,176,32,.35);background:rgba(255,176,32,.07);border-radius:var(--r);margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ================= PREMIUM THEME ================= */
:root{--bg:#15171b;--panel:#1c1f24;--panel2:#23272e;--raise:#2a2f37;--line:#2f343d;--line2:#3a404b;--txt:#ecebe7;--mut:#8f949c;--acc:#c9ab80;--accTxt:#1b1610;--accSoft:rgba(201,171,128,.12);--green:#5fcf8f;--amber:#e8a94b;--red:#ef6a6a;--blue:#7fb2e8;--tape:#e4ef4f;--r:12px}
html,body{font-family:"Archivo",system-ui,sans-serif;font-size:14px;letter-spacing:.005em;background:var(--bg)}
body{background:radial-gradient(1200px 600px at 85% -10%,rgba(201,171,128,.06),transparent 60%),var(--bg);min-height:100vh}
header{background:rgba(21,23,27,.86);border-bottom:1px solid var(--line);padding:0 24px;height:60px;gap:28px}
.logo{gap:12px}
.logo .tape{background:none;color:var(--txt);transform:none;font-family:"Archivo",sans-serif;font-stretch:125%;font-weight:800;font-size:15px;padding:0;letter-spacing:.02em}
.logo .tape::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 10px rgba(95,207,143,.7);margin-right:9px;vertical-align:1px}
.logo .muted{font-weight:500!important;color:var(--mut)}
nav{gap:2px;height:100%;align-items:stretch}
nav button{border-radius:0;padding:0 14px;color:var(--mut);font-weight:600;position:relative;background:none!important}
nav button:hover{color:var(--txt)}
nav button.on{color:var(--txt);background:none}
nav button.on::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;background:var(--acc);border-radius:2px}
.sync{font-size:12px}
.who{background:var(--panel2);border-color:var(--line)}
main{padding:28px 24px 120px;max-width:1360px}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:9px 16px;font-weight:600;transition:background .15s,border-color .15s}
.btn:hover{background:var(--raise);border-color:#4a515d}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accTxt)}
.btn.pri:hover{background:#d6ba92}
.btn.ghost{background:none;border-color:transparent;color:var(--mut)}
.btn.ghost:hover{color:var(--txt);background:var(--panel2)}
.btn:focus-visible,.pick:focus-visible,.inp:focus-visible,.lnk:focus-visible,.rc:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
input[type=text],input[type=number],input[type=url],input[type=password],input:not([type]),select,textarea{background:var(--bg);border-color:var(--line2);border-radius:9px;padding:9px 12px}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
.pill.DEAD{background:var(--tape);color:#1a1a00;border-color:var(--tape)}
.toast{background:var(--raise);border-left-color:var(--acc);border-radius:10px}
.lnk{background:none;border:0;color:var(--acc);cursor:pointer;font-weight:600;padding:0;font:inherit;font-weight:600}
.lnk.sm{font-size:12px}
.note{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:12px 16px;margin-bottom:20px;color:var(--mut);display:flex;gap:12px;align-items:center}
.muted{color:var(--mut)}
/* entry */
.entry{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;align-items:start}
@media(max-width:1060px){.entry{grid-template-columns:minmax(0,1fr)}.aside{position:static!important}}
@media(max-width:760px){
  header{height:auto;padding:10px 14px 0;gap:8px 14px;flex-wrap:wrap}
  .sync{margin-left:auto}
  nav{order:3;width:100%;overflow-x:auto;height:44px;flex-wrap:nowrap;margin:0 -4px}
  nav button{white-space:nowrap;padding:0 10px}
  nav button.on::after{left:10px;right:10px}
  main{padding:16px 12px 100px}
  .plate-no{font-size:38px}
  .g2.ssd{grid-template-columns:1fr 110px}
  #syncTxt{display:none}
}
.form{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:visible}
.ident{display:grid;grid-template-columns:auto 1fr;gap:28px;padding:26px 28px;border-bottom:1px solid var(--line);align-items:end;background:linear-gradient(180deg,rgba(255,255,255,.02),transparent);border-radius:16px 16px 0 0}
@media(max-width:640px){.ident{grid-template-columns:1fr;gap:18px;padding:20px}}
.plate{display:flex;flex-direction:column;gap:4px;min-width:210px}
.plate-k{font-size:12px;color:var(--mut)}
.plate-no{font-stretch:125%;font-weight:800;font-size:44px;line-height:1;letter-spacing:-.01em;color:var(--txt)}
.plate.edit .plate-no{color:var(--acc)}
.plate-lock{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--mut);margin-top:6px}
.plate-lock svg{width:14px;height:14px}
.plate .lnk{align-self:flex-start;margin-top:2px}
.fld{display:flex;flex-direction:column;gap:7px;min-width:0}
.fld>label{font-size:12.5px;color:var(--mut);font-weight:500}
.fld.grow{flex:1}
.hint{font-size:12px;color:var(--mut)}
.inp{background:var(--bg)!important;border:1px solid var(--line2)!important;border-radius:10px!important;padding:12px 14px!important;font-size:15px;width:100%;outline:none}
.inp:focus{border-color:var(--acc)!important}
.grp{padding:22px 28px;border-bottom:1px solid var(--line)}
@media(max-width:640px){.grp{padding:18px 20px}}
.grp h3{margin:0 0 14px;font-size:14px;font-weight:700;color:var(--txt)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px}
@media(max-width:720px){.g2{grid-template-columns:1fr}}
.g2.ssd{grid-template-columns:1fr 140px}
.pick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;cursor:pointer;color:var(--txt);font-size:14.5px;font-weight:500;transition:border-color .15s,background .15s;min-height:46px}
.pick:hover{border-color:#4a515d;background:#181a1f}
.pick.open{border-color:var(--acc);background:#181a1f}
.pick .pv{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick.is-empty .pv{color:#6c7179}
.pick .chev{width:16px;height:16px;color:var(--mut);flex:none;transition:transform .15s}
.pick.open .chev{transform:rotate(180deg)}
.ram{display:flex;flex-direction:column;gap:16px}
.ram-p{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 96px;gap:12px;align-items:end;transition:opacity .2s}
@media(max-width:720px){.ram-p{grid-template-columns:1fr 1fr}}
.ram-p.off,.qty.off{opacity:.35;pointer-events:none}
.ram-tot{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;height:46px}
.ram-tot span{font-stretch:125%;font-weight:800;font-size:24px;line-height:1;color:var(--acc)}
.ram-tot small{font-size:11px;color:var(--mut)}
.actions{display:flex;gap:10px;align-items:center;padding:18px 28px;position:sticky;bottom:0;background:rgba(28,31,36,.94);backdrop-filter:blur(10px);border-radius:0 0 16px 16px;border-top:1px solid var(--line);z-index:4}
.actions .sp{flex:1}
@media(max-width:640px){.actions{padding:14px 16px;flex-wrap:wrap}.actions .btn.pri,.actions #eSaveNext{flex:1}}
.pop{position:absolute;z-index:200;background:var(--raise);border:1px solid var(--line2);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.55);overflow:hidden;animation:popin .12s ease-out;outline:none}
@keyframes popin{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.pop{animation:none}}
.pop-s{padding:8px;border-bottom:1px solid var(--line)}
.pop-s input{background:var(--bg)!important;border:1px solid var(--line2)!important;border-radius:8px!important;padding:9px 11px!important;width:100%}
.pop-l{max-height:min(320px,45vh);overflow:auto;padding:6px}
.opt{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:14px}
.opt.act{background:rgba(255,255,255,.06)}
.opt .ol{flex:1;min-width:0;display:flex;flex-direction:column}
.opt .ol small{font-size:11.5px;color:var(--mut);margin-top:2px}
.opt .oc{font-size:11px;color:var(--mut);background:var(--bg);border-radius:999px;padding:2px 8px;font-variant-numeric:tabular-nums}
.opt .ok{color:var(--acc);font-weight:800}
.opt.sel .ol{color:var(--acc);font-weight:600}
.opt.muted{color:var(--mut)}
.opt.add{color:var(--acc);font-weight:600;border-top:1px solid var(--line);border-radius:0 0 8px 8px;margin-top:4px}
.aside{display:flex;flex-direction:column;gap:20px;position:sticky;top:84px}
.prev,.recent{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.prev-h{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:14px}
.prev-h .muted{font-weight:500}
.prev-b{position:relative;overflow:hidden;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.rc{display:flex;gap:10px;align-items:baseline;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;cursor:pointer;color:var(--txt);text-align:left;font:inherit}
.rc:first-of-type{border-top:0}
.rc b{font-stretch:112%;min-width:52px}
.rc span{flex:1;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.rc em{font-style:normal;font-size:11.5px;color:var(--mut)}
.rc:hover b{color:var(--acc)}
/* other tabs */
.toolbar{margin-bottom:18px}
.selbar{background:transparent;border-bottom:1px solid var(--line);padding:12px 16px}
th{font-size:12px;text-transform:none;letter-spacing:0;color:var(--mut);font-weight:600}
td,th{padding:12px 14px}
td.name{font-stretch:112%;font-weight:700;white-space:nowrap}
tbody td{font-size:13px;line-height:1.35}
td .muted{color:#6c7179}
tbody tr:hover{background:rgba(255,255,255,.025)}
.part .rh,.rack .rh{font-weight:700}
.modal .mh h3{font-weight:700}
.stagewrap{background:radial-gradient(circle,#2a2f37 1px,transparent 1px) 0 0/18px 18px,var(--panel)}
.side h4{text-transform:none;letter-spacing:0;font-size:13px;color:var(--txt);font-weight:700}

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;

      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var c, mc, r, mr, qrSvg='', rect;

        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;

/* ================= API ================= */
async function api(action,payload={}){
  if(demo()){
    const d=demoDB();
    if(action==='list')return {ok:true,...d};
    const stamp=()=>new Date().toLocaleString('sv').slice(0,19);
    const put=(x)=>{const i=d.items.findIndex(y=>y.ID===x.ID);const it=Object.assign(i>=0?d.items[i]:Object.fromEntries(d.headers.map(h=>[h,''])),x);if(!it.ID)it.ID='PC-'+uid().toUpperCase();it.Updated=stamp();it['Updated by']=S.user||'demo';i>=0?d.items[i]=it:d.items.push(it);return Object.assign({},it)};
    if(action==='save'){const it=put(payload.item);LS.set('ewc2_demo',d);return {ok:true,item:it}}
    if(action==='saveMany'){const out=payload.items.map(x=>put(x.item));LS.set('ewc2_demo',d);return {ok:true,items:out,conflicts:[]}}
    if(action==='delete'){d.items=d.items.filter(x=>x.ID!==payload.id);LS.set('ewc2_demo',d);return {ok:true}}
    if(action==='addPart'){(d.lists[payload.list]=d.lists[payload.list]||[]);if(!d.lists[payload.list].includes(payload.value))d.lists[payload.list].push(payload.value);LS.set('ewc2_demo',d);return {ok:true}}
    if(action==='saveTemplates'){d.templates=payload.templates;LS.set('ewc2_demo',d);return {ok:true}}
    if(action==='ping')return {ok:true,sheet:'demo'};
  }
  let r;
  if(action==='list'||action==='ping'){
    r=await fetch(S.cfg.url+(S.cfg.url.includes('?')?'&':'?')+'action='+action+'&token='+encodeURIComponent(S.cfg.token));
  }else{
    r=await fetch(S.cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,token:S.cfg.token,user:S.user},payload))});
  }
  const j=await r.json();
  if(!j.ok)throw errOf(j);
  return j;
}
function applyData(j){
  S.headers=j.headers&&j.headers.length?j.headers:[...DEFAULT_HEADERS];
  S.lists=j.lists||{};
  const old=Object.fromEntries(S.items.map(i=>[i.ID,i.Updated]));
  if(S.lastHash){(j.items||[]).forEach(i=>{if(old[i.ID]!==i.Updated&&i['Updated by']!==S.user)S.fresh.add(i.ID)})}
  S.items=j.items||[];
  S.lastHash=JSON.stringify(S.items);
  if(j.templates&&j.templates.length)S.templates=j.templates;else if(!S.templates.length)S.templates=defaultTemplates();
  if(!S.templates.find(t=>t.id===S.tplId))S.tplId=S.templates[0].id;
}
async function load(){
  setStatus('busy','loading…');
  try{
    const j=await api('list');applyData(j);
    setStatus(demo()?'demo':'ok',demo()?'demo mode (data in this browser)':'synced '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){
    setStatus('err','connection error');toast('Could not load the sheet: '+e.message,true);
    if(!S.templates.length)S.templates=defaultTemplates(),S.tplId=S.templates[0].id;
  }
  render();
}
let polling=false,dragging=false;
async function poll(){
  if(polling||demo()||document.hidden||dragging)return;
  polling=true;
  try{
    const j=await api('list');
    const h=JSON.stringify(j.items||[]);
    const changed=h!==S.lastHash;
    if(changed){
      applyData(j);
      if(!$('#ov')&&!(S.tab==='labels'&&S.selEl)&&!(S.tab==='add'&&['INPUT','TEXTAREA'].includes((document.activeElement||{}).tagName)))render();
      const n=S.fresh.size;if(n)toast(n+(n===1?' PC was':' PCs were')+' updated by someone else');
      setTimeout(()=>{S.fresh.clear()},3000);
    }
    setStatus('ok','synced '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){setStatus('err','offline – retrying')}
  polling=false;
}
setInterval(poll,15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});

// pokazuje, co zmieniła druga osoba, i pozwala wybrać: nadpisać moimi albo wziąć aktualne
function conflictModal(data,mine,retry,onTake){
  const cur=data.item||{};
  if(data.conflict==='deleted'){toast('Someone deleted this PC in the meantime',true);S.items=S.items.filter(x=>x.ID!==mine.ID);closeModal();render();return}
  if(data.conflict==='duplicate'){
    modal(`<div class="mh"><h3>PC ${esc(mine['PC No'])} already exists</h3><button class="x" data-close>×</button></div>
    <div class="mb">The sheet already has a PC with this number – someone may have just added it.</div>
    <div class="mf"><button class="btn pri" data-close>Go back</button></div>`,ov=>{ov.querySelector('#cfForce').onclick=()=>{closeModal();retry(true)}});
    return;
  }
  const who=cur['Updated by']?esc(cur['Updated by']):'Someone';
  modal(`<div class="mh"><h3>${who} changed this PC while you were editing</h3><button class="x" data-close>×</button></div>
  <div class="mb"><div class="muted" style="font-size:12px">${esc(nm(cur))} – last change ${esc(cur.Updated||'')}. You both changed these fields:</div>
  <table class="diff"><thead><tr><th>Field</th><th>In the sheet now (${who})</th><th>Your version</th></tr></thead><tbody>
  ${(data.fields||[]).map(k=>`<tr><td><b>${esc(k)}</b></td><td class="theirs">${esc(cur[k])||'<i>empty</i>'}</td><td class="mine">${esc(mine[k])||'<i>empty</i>'}</td></tr>`).join('')}
  </tbody></table><div class="muted" style="font-size:12px;margin-top:10px">Your other changes don't clash and will be kept.</div></div>
  <div class="mf"><button class="btn" id="cfTake">Keep theirs</button><button class="btn pri" id="cfForce">Use mine</button></div>`,ov=>{
    ov.querySelector('#cfTake').onclick=()=>{closeModal();onTake&&onTake(cur)};
    ov.querySelector('#cfForce').onclick=()=>{closeModal();retry(true)};
  });
}
function mergeItem(it){const i=S.items.findIndex(x=>x.ID===it.ID);i>=0?S.items[i]=it:S.items.push(it);S.lastHash=''}

/* ================= QR ================= */
qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8'];
function qrSvg(text){
  let q;
  for(const ec of ['M','L']){try{q=qrcode(0,ec);q.addData(String(text||' '));q.make();break}catch(e){q=null}}
  if(!q)return '<svg viewBox="0 0 10 10"><text x="0" y="6" font-size="3">too long</text></svg>';
  const n=q.getModuleCount(),m=1;let d='';
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))d+=`M${x+m} ${y+m}h1v1h-1z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n+2*m} ${n+2*m}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}
function linkBase(){return S.cfg.linkBase||(location.origin+location.pathname)}
function specText(it){
  const head=['PC '+(it['PC No']||'?'),empty(it['Old Label'])?'':it['Old Label']].filter(Boolean);
  const lab={'M2 SSD':'SSD','Power Supply':'PSU','Capture Card 1':'Capture 1','Capture Card 2':'Capture 2','Memory':'RAM','Motherboard':'MB'};
  const rest=cats().filter(c=>!empty(it[c.k])).map(c=>(lab[c.k]||c.k)+': '+it[c.k]);
  return [...head,...rest].join('\n');
}
function qrContent(it,mode,custom){
  if(mode==='link')return linkBase()+'?id='+encodeURIComponent(it.ID);
  if(mode==='name')return it['PC No']||it.ID;
  if(mode==='custom')return fill(custom||'',it);
  return specText(it);
}
function fill(tpl,it){return String(tpl||'').replace(/\{([^}]+)\}/g,(m,k)=>it&&it[k.trim()]!=null?it[k.trim()]:'')}
function downloadQR(it,mode){
  const svg=qrSvg(qrContent(it,mode));
  const img=new Image();
  img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=1024;const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(img,0,0,1024,1024);c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(it['PC No']||it.ID).replace(/[^\w\-]+/g,'_')+'_QR.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)})};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

/* ================= części: definicje ================= */
const CATS=[
  {k:'Motherboard',l:'Motherboard',list:'Motherboard'},
  {k:'CPU',l:'CPU',list:'CPU'},
  {k:'Memory',l:'RAM',list:'Memory',type:'ram'},
  {k:'GPU',l:'GPU',list:'GPU'},
  {k:'M2 SSD',l:'M.2 SSD',list:'M2 SSD',type:'qty'},
  {k:'Power Supply',l:'Power supply',list:'Power Supply'},
  {k:'Capture Card 1',l:'Capture Card 1',list:'Capture Card',none:'-'},
  {k:'Capture Card 2',l:'Capture Card 2',list:'Capture Card',none:'-'}
];
const cats=()=>CATS.filter(c=>S.headers.includes(c.k));
const LISTS=()=>{const o={};cats().forEach(c=>{(o[c.list]=o[c.list]||{list:c.list,l:c.type==='ram'?'Memory':c.list==='Capture Card'?'Capture cards':c.l,cols:[],type:c.type});o[c.list].cols.push(c.k)});return Object.values(o)};
const empty=v=>{v=String(v==null?'':v).trim();return !v||v==='-'};
const hasSpec=it=>cats().some(c=>!empty(it[c.k]));
const isBlank=it=>!hasSpec(it)&&empty(it['Old Label']);
function parseRam(s){
  s=String(s||'').trim();
  const m=s.match(/^(.*?)\s*(\d+)\s*gb\s*\(\s*(\d+)\s*x\s*(\d+)\s*gb\s*\)\s*(\d+)\s*MT\/s\s*(.*)$/i);
  if(!m)return {model:s,n:'',size:'',mt:'',type:''};
  return {model:m[1].trim(),n:m[3],size:m[4],mt:m[5],type:m[6].trim()};
}
function ramStr(r){
  if(!r||!String(r.model||'').trim())return '';
  if(!r.n&&!r.size&&!r.mt)return (r.model+' '+(r.type||'')).trim();
  const tot=(+r.n||0)*(+r.size||0);
  return `${r.model.trim()} ${tot}gb (${r.n}x${r.size}gb) ${r.mt}MT/s${r.type?' '+r.type:''}`;
}
function ramShort(s){const r=parseRam(s);return r.n?`${(+r.n)*(+r.size)} GB (${r.n}×${r.size}) ${r.mt} MT/s`:s}
function parseQty(s){s=String(s||'').trim();const m=s.match(/^(\d+)\s*x\s+(.*)$/i);return m?{q:+m[1],model:m[2].trim()}:{q:1,model:s}}
const qtyStr=(q,model)=>!String(model||'').trim()?'':((+q>1?(+q)+'x ':'')+model.trim());
// wszystkie wartości danej listy: katalog + to, co już jest wpisane w kompach
function listValues(L){
  const used={};
  S.items.forEach(it=>L.cols.forEach(k=>{const v=String(it[k]||'').trim();if(!empty(v))used[v]=(used[v]||0)+1}));
  const vals=uniq([...((S.lists[L.list])||[]).filter(v=>!empty(v)),...Object.keys(used)]);
  return vals.map(v=>({v,n:used[v]||0,inList:((S.lists[L.list])||[]).includes(v)}));
}
// kafelki do wyboru: dla RAM i SSD grupujemy po modelu
function tileModels(c){
  const L=LISTS().find(x=>x.list===c.list);
  const vals=listValues(L);
  const map={};
  vals.forEach(({v,n})=>{const m=c.type==='ram'?parseRam(v).model:c.type==='qty'?parseQty(v).model:v;(map[m]=map[m]||{m,n:0,best:v,bestN:-1});map[m].n+=n;if(n>map[m].bestN){map[m].best=v;map[m].bestN=n}});
  return Object.values(map).sort((a,b)=>b.n-a.n||cmp(a.m,b.m));
}
function nextFree(){
  const nums=S.items.map(i=>({i,n:parseInt(i['PC No'],10)})).filter(x=>!isNaN(x.n));
  const free=nums.filter(x=>isBlank(x.i)).sort((a,b)=>a.n-b.n)[0];
  if(free)return String(free.n);
  return String(nums.reduce((m,x)=>Math.max(m,x.n),0)+1);
}
function virt(it){const o=Object.assign({},it);if(o['Old Label']==='-')o['Old Label']='';o.Capture=[it['Capture Card 1'],it['Capture Card 2']].filter(v=>!empty(v)).join(' + ')||'-';o.RAM=it.Memory?ramShort(it.Memory):'';return o}

function newEnt(keep){
  const e={id:null,vals:{'PC No':nextFree(),'Old Label':''},ram:{model:'',n:'',size:'',mt:'',type:''},ramRaw:'',ramDirty:false,ssd:{q:1,model:''}};
  cats().forEach(c=>e.vals[c.k]='');
  if(keep){cats().forEach(c=>e.vals[c.k]=keep.vals[c.k]);e.ram=Object.assign({},keep.ram);e.ramRaw=keep.ramRaw;e.ramDirty=keep.ramDirty;e.ssd=Object.assign({},keep.ssd)}
  return e;
}
function entFrom(it){
  const e=newEnt();e.id=it.ID;e.vals['PC No']=it['PC No']||'';e.vals['Old Label']=it['Old Label']||'';
  cats().forEach(c=>e.vals[c.k]=it[c.k]||'');
  if(it.Memory){e.ram=parseRam(it.Memory);e.ramRaw=it.Memory}
  if(it['M2 SSD'])e.ssd=parseQty(it['M2 SSD']);
  return e;
}
function entValue(c,e){
  if(c.type==='ram')return e.ramDirty?ramStr(e.ram):(e.ramRaw||ramStr(e.ram));
  if(c.type==='qty')return qtyStr(e.ssd.q,e.ssd.model);
  return e.vals[c.k];
}

let PICK=null;
function closePick(){if(PICK){PICK.el.remove();PICK.btn.classList.remove('open');PICK=null}}
function openPick(btn,o){
  if(PICK&&PICK.btn===btn)return closePick();
  closePick();
  const el=document.createElement('div');el.className='pop';el.setAttribute('role','listbox');
  el.innerHTML=`${o.search===false?'':`<div class="pop-s"><input placeholder="${esc(o.searchPh||'Search or type a new one…')}" autocomplete="off"></div>`}<div class="pop-l"></div>`;
  document.body.appendChild(el);btn.classList.add('open');
  PICK={el,btn,o,act:0};
  const r=btn.getBoundingClientRect();
  const w=Math.max(r.width,o.minW||300);
  let left=Math.min(r.left+scrollX,scrollX+innerWidth-w-10);
  const below=innerHeight-r.bottom,up=below<360&&r.top>below;
  el.style.cssText=`left:${Math.max(10,left)}px;width:${w}px;`+(up?`top:${r.top+scrollY-6}px;transform:translateY(-100%)`:`top:${r.bottom+scrollY+6}px`);
  if(up)el.classList.add('up');
  const inp=el.querySelector('input'),list=el.querySelector('.pop-l');
  const draw=()=>{
    const q=(inp?inp.value:'').trim().toLowerCase();
    let rows=o.options.filter(x=>!q||String(x.label).toLowerCase().includes(q)||String(x.v).toLowerCase().includes(q));
    const items=[];
    if(o.none!=null&&!q)items.push({v:o.none,label:o.none==='-'?'None':'Not set',muted:true});
    items.push(...rows);
    const exact=o.options.some(x=>String(x.v).toLowerCase()===q);
    if(q&&!exact&&o.custom)items.push({v:inp.value.trim(),label:`Use "${inp.value.trim()}"`,custom:true});
    if(o.onAdd)items.push({add:true,label:q&&!exact?`Add "${inp.value.trim()}" as a new model`:'Add a new model…'});
    PICK.items=items;PICK.act=Math.min(PICK.act,items.length-1);
    list.innerHTML=items.length?items.map((x,i)=>`<div class="opt ${x.add?'add':''} ${x.muted?'muted':''} ${String(x.v)===String(o.value)&&!x.add?'sel':''} ${i===PICK.act?'act':''}" data-i="${i}" role="option">
      <span class="ol">${esc(x.label)}${x.sub?`<small>${esc(x.sub)}</small>`:''}</span>${x.count!=null?`<span class="oc">${x.count}</span>`:''}${String(x.v)===String(o.value)&&!x.add?'<span class="ok">✓</span>':''}</div>`).join(''):'<div class="opt muted">No matches</div>';
  };
  const choose=i=>{const x=PICK.items[i];if(!x)return;const q=inp?inp.value.trim():'';closePick();btn.focus();if(x.add)o.onAdd(q);else o.onPick(x.v)};
  list.addEventListener('pointerdown',e=>{const d=e.target.closest('.opt[data-i]');if(d){e.preventDefault();choose(+d.dataset.i)}});
  list.addEventListener('pointermove',e=>{const d=e.target.closest('.opt[data-i]');if(d&&+d.dataset.i!==PICK.act){PICK.act=+d.dataset.i;list.querySelectorAll('.opt').forEach(n=>n.classList.toggle('act',n.dataset.i==PICK.act))}});
  const key=e=>{
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();PICK.act=(PICK.act+(e.key==='ArrowDown'?1:-1)+PICK.items.length)%PICK.items.length;draw();const a=list.querySelector('.act');a&&a.scrollIntoView({block:'nearest'})}
    else if(e.key==='Enter'){e.preventDefault();choose(PICK.act)}
    else if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closePick();btn.focus()}
    else if(e.key==='Tab'){closePick()}
  };
  if(inp){inp.oninput=()=>{PICK.act=0;draw()};inp.onkeydown=key;setTimeout(()=>inp.focus(),0)}else{el.tabIndex=-1;el.onkeydown=key;setTimeout(()=>el.focus(),0)}

  draw();const a=list.querySelector('.act');a&&a.scrollIntoView({block:'nearest'});
}

async function saveEnt(next,tries=0){
  if(tries>4)return toast('Could not find a free PC number – refresh and try again',true);
  const e=S.ent;const vals=entItem();
  if(!String(vals['PC No']).trim())return toast('PC number is missing',true);
  let target=e.id?S.items.find(x=>x.ID===e.id):null;
  if(!target){
    const same=S.items.find(x=>String(x['PC No']).trim().toLowerCase()===String(vals['PC No']).trim().toLowerCase());
    if(same&&!isBlank(same)){
      // numer zajęty w międzyczasie – bierzemy następny wolny, nigdy duplikat
      const old=vals['PC No'];e.vals['PC No']=nextFree();
      toast(`PC ${old} was just taken by someone else – using PC ${e.vals['PC No']}`);
      return saveEnt(next,tries+1);
    }
    if(same)target=same; // pusty numer z arkusza – wypełniamy ten wiersz
  }
  const item={ID:target?target.ID:''},orig={};
  Object.keys(vals).forEach(k=>{const was=target?String(target[k]==null?'':target[k]):'';if(String(vals[k])!==was){item[k]=vals[k];if(target)orig[k]=was}});
  if(target&&Object.keys(item).length===1){toast('No changes to save');if(next){S.ent=newEnt(e);render()}return}
  const btns=document.querySelectorAll('#eSave,#eSaveNext');btns.forEach(b=>b.disabled=true);
  const done=j=>{mergeItem(j.item);toast('Saved PC '+j.item['PC No']);S.ent=next?newEnt(e):(e.id?entFrom(j.item):newEnt());render();if(next)setTimeout(()=>{const o=$('#eOld');o&&o.focus()},30)};
  try{
    done(await api('save',{item,orig:target?orig:null}));
  }catch(err){
    btns.forEach(b=>b.disabled=false);
    if(err.data&&(err.data.conflict==='duplicate'||(err.data.conflict==='changed'&&target&&isBlank(target)))&&!e.id){try{applyData(await api('list'))}catch(_){}
      const old=vals['PC No'];e.vals['PC No']=nextFree();toast(`PC ${old} was just taken by someone else – using PC ${e.vals['PC No']}`);return saveEnt(next,tries+1)}
    if(err.data&&err.data.conflict)conflictModal(err.data,vals,async()=>{try{done(await api('save',{item,orig:target?orig:null,force:true}))}catch(x){toast(x.message,true)}},cur=>{mergeItem(cur);editInEntry(cur.ID)});
    else toast('Not saved: '+err.message,true);
  }
}

function openBulk(){

  const order=filtered().map(i=>i.ID);items.sort((a,b)=>order.indexOf(a.ID)-order.indexOf(b.ID));

    ${fields.map(row).join('')}
    ${fields.includes('Slot')?`<div class="brow" style="margin-top:8px;border-top:1px solid var(--line);padding-top:10px"><input type="checkbox" id="bNum"><label>Number slots</label><div class="row" style="align-items:center"><span class="muted" style="font-size:12px;flex:none">from</span><input type="number" id="bNumFrom" value="1" style="width:80px;flex:none"><span class="muted" style="font-size:12px">in list order</span></div></div>`:''}
    ${fields.map(k=>`<datalist id="bdl_${esc(k)}">${lists[k].map(v=>`<option value="${esc(v)}">`).join('')}</datalist>`).join('')}
  </div>

    ov.querySelectorAll('[data-v]').forEach(i=>{const on=()=>{const c=ov.querySelector(`[data-on="${CSS.escape(i.dataset.v)}"]`);c.checked=true;c.closest('.brow').classList.add('on')};i.addEventListener('input',on);i.addEventListener('change',on)});

    const nf=ov.querySelector('#bNumFrom');if(nf)nf.oninput=()=>ov.querySelector('#bNum').checked=true;
    ov.querySelector('#bSave').onclick=async()=>{
      const ch={};ov.querySelectorAll('[data-on]:checked').forEach(c=>{const k=c.dataset.on;ch[k]=ov.querySelector(`[data-v="${CSS.escape(k)}"]`).value});
      const num=ov.querySelector('#bNum')&&ov.querySelector('#bNum').checked,from=+(ov.querySelector('#bNumFrom')||{}).value||1;
      if(!Object.keys(ch).length&&!num)return toast('Nothing changed',true);

    <label class="f">Template name<input id="tName" value="${esc(t.name)}"></label>
    <div class="row"><label class="f">Width (mm)<input type="number" id="tW" value="${t.w}" min="10" max="300" step="1"></label><label class="f">Height (mm)<input type="number" id="tH" value="${t.h}" min="5" max="300" step="1"></label></div>
    <div class="row"><label class="f">Background<input type="color" id="tBg" value="${t.bg||'#ffffff'}" style="height:36px;padding:2px"></label><label class="f" style="flex-direction:row;align-items:center;gap:8px;padding-bottom:8px"><input type="checkbox" id="tBorder" ${t.border?'checked':''}> Border</label></div>
    <h4>Elements</h4>
    <div class="row"><button class="btn sm" id="aText">Add text</button><button class="btn sm" id="aQR">Add QR</button></div>
    <select id="aField"><option value="">Add a field…</option>${[...S.headers.filter(h=>!READONLY.includes(h)),'Capture','RAM'].map(h=>`<option>${esc(h)}</option>`).join('')}</select>
    <div class="ellist">${t.elements.map(e=>`<div class="it ${e.id===S.selEl?'on':''}" data-el="${e.id}"><span class="ty">${e.type==='qr'?'QR':'TXT'}</span><span class="t">${esc(e.type==='qr'?({spec:'full spec',link:'link',name:'PC number',custom:e.text}[e.qr]):e.text)||'<empty>'}</span></div>`).join('')||'<span class="muted" style="font-size:12px">No elements</span>'}</div>
  </div>
  <div class="card stagewrap">
    <div class="zoomrow">Preview with <select id="pv" style="width:auto;max-width:260px">${S.items.filter(i=>!isBlank(i)).map(i=>`<option value="${esc(i.ID)}" ${i.ID===S.previewId?'selected':''}>PC ${esc(i['PC No'])}${empty(i['Old Label'])?'':' · '+esc(i['Old Label'])}</option>`).join('')}</select>
      &nbsp;Zoom <input type="range" id="zm" min="1.5" max="6" step="0.25" value="${S.zoom}" style="width:110px"></div>
    <div class="canvasHold edit" id="cv" style="width:${t.w*3.7795*S.zoom}px;height:${t.h*3.7795*S.zoom}px">
      <div id="cvIn" style="transform:scale(${S.zoom});transform-origin:0 0;width:${t.w}mm">${labelHTML(t,prev||{},true)}</div>
    </div>
    <div class="muted" style="font-size:12px">${t.w} × ${t.h} mm – drag to move, corner to resize, arrow keys nudge 0.5 mm (Shift 2 mm), Delete removes</div>
    <div class="row" style="flex:none"><button class="btn pri" id="tPrint">Print labels…</button></div>
  </div>
  <div class="card side" id="props">${el?propsHTML(el):'<h4>Properties</h4><span class="muted" style="font-size:12px">Click an element on the label or in the list to edit it.</span>'}</div>
  </div>`;
  bindEditor(t,el);
}
function propsHTML(el){
  const num=(k,lab,step=0.5)=>`<label class="f">${lab}<input type="number" data-p="${k}" value="${el[k]}" step="${step}"></label>`;
  let h=`<h4>${el.type==='qr'?'QR code':'Text'}</h4>`;
  if(el.type==='qr'){
    h+=`<label class="f">QR content<select data-p="qr">${[['spec','Full spec (text)'],['link','Link to this PC on the site'],['name','PC number only'],['custom','Custom text / fields']].map(([v,l])=>`<option value="${v}" ${el.qr===v?'selected':''}>${l}</option>`).join('')}</select></label>`;
    if(el.qr==='custom')h+=`<label class="f">QR text<textarea data-p="text" id="pText">${esc(el.text)}</textarea></label>${chips()}`;
  }else{
    h+=`<label class="f">Text – fields in {braces}, Enter for a new line<textarea data-p="text" id="pText">${esc(el.text)}</textarea></label>${chips()}`;
    h+=`<div class="row">${num('fs','Size (pt)',0.5)}<label class="f">Colour<input type="color" data-p="color" value="${el.color||'#000000'}" style="height:36px;padding:2px"></label></div>`;
    h+=`<div class="row"><label class="f" style="flex-direction:row;gap:6px;align-items:center"><input type="checkbox" data-p="bold" ${el.bold?'checked':''}>Bold</label><label class="f" style="flex-direction:row;gap:6px;align-items:center"><input type="checkbox" data-p="upper" ${el.upper?'checked':''}>Uppercase</label></div>`;
    h+=`<label class="f">Horizontal align<div class="seg">${['left','center','right'].map(a=>`<button data-al="${a}" class="${(el.align||'left')===a?'on':''}">${{left:'Left',center:'Centre',right:'Right'}[a]}</button>`).join('')}</div></label>`;
    h+=`<label class="f">Vertical align<div class="seg">${['top','middle','bottom'].map(a=>`<button data-va="${a}" class="${(el.valign||'middle')===a?'on':''}">${{top:'Top',middle:'Middle',bottom:'Bottom'}[a]}</button>`).join('')}</div></label>`;
  }
  h+=`<h4>Position (mm)</h4><div class="row">${num('x','X')}${num('y','Y')}</div><div class="row">${num('w','Width')}${num('h','Height')}</div>`;
  h+=`<div class="row"><button class="btn sm" id="eDup">Duplicate</button><button class="btn sm danger" id="eDel">Delete element</button></div>`;
  return h;
}
function chips(){return `<div class="chips">${[...S.headers.filter(h=>!READONLY.includes(h)),'Capture','RAM'].map(h=>`<span class="chip" data-ins="${esc(h)}">{${esc(h)}}</span>`).join('')}</div>`}
function redrawCanvas(t){
  const prev=S.items.find(x=>x.ID===S.previewId)||{};
  $('#cvIn').innerHTML=labelHTML(t,prev,true);
  $('#cv').style.width=t.w*3.7795*S.zoom+'px';$('#cv').style.height=t.h*3.7795*S.zoom+'px';
  bindCanvas(t);
}
function bindCanvas(t){
  const pxPerMm=3.7795*S.zoom;
  $('#cvIn').querySelectorAll('.el').forEach(node=>{
    node.onpointerdown=e=>{
      e.preventDefault();
      const el=t.elements.find(x=>x.id===node.dataset.id);
      if(S.selEl!==el.id){S.selEl=el.id;renderLabels();}
      const n2=$('#cvIn').querySelector(`[data-id="${el.id}"]`);
      const resize=!!e.target.dataset.h;
      const sx=e.clientX,sy=e.clientY,o={x:el.x,y:el.y,w:el.w,h:el.h};
      const snap=v=>Math.round(v*2)/2;
      const mv=ev=>{
        const dx=(ev.clientX-sx)/pxPerMm,dy=(ev.clientY-sy)/pxPerMm;
        if(resize){el.w=Math.max(2,snap(o.w+dx));el.h=Math.max(2,snap(o.h+dy));if(el.type==='qr')el.h=el.w}
        else{el.x=snap(o.x+dx);el.y=snap(o.y+dy)}
        n2.style.left=el.x+'mm';n2.style.top=el.y+'mm';n2.style.width=el.w+'mm';n2.style.height=el.h+'mm';
      };
      dragging=true;
      const up=()=>{dragging=false;window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);persistTemplates();
        const p=$('#props');if(p)['x','y','w','h'].forEach(k=>{const i=p.querySelector(`[data-p="${k}"]`);if(i)i.value=el[k]})};
      window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);
    };
  });
}
function bindEditor(t,el){
  const m=$('#main'),up=()=>{persistTemplates();};
  $('#tSel').onchange=e=>{S.tplId=e.target.value;S.selEl=null;LS.set('ewc2_tpl',S.tplId);renderLabels()};
  $('#tNew').onclick=()=>{const n={id:'t_'+uid(),name:'New template',w:62,h:29,border:true,elements:[{id:uid(),type:'text',text:'{PC No}',x:3,y:3,w:56,h:12,fs:16,bold:true,align:'center',valign:'middle',upper:true,color:'#000000'}]};S.templates.push(n);S.tplId=n.id;S.selEl=null;up();renderLabels()};
  $('#tDup').onclick=()=>{const n=JSON.parse(JSON.stringify(t));n.id='t_'+uid();n.name=t.name+' copy';n.elements.forEach(e=>e.id=uid());S.templates.push(n);S.tplId=n.id;up();renderLabels()};
  $('#tDel').onclick=()=>{if(S.templates.length<2)return toast('Keep at least one template',true);if(!confirm('Delete template "'+t.name+'"?'))return;S.templates=S.templates.filter(x=>x!==t);S.tplId=S.templates[0].id;S.selEl=null;up();renderLabels()};
  $('#tName').oninput=e=>{t.name=e.target.value;up();const o=$('#tSel').selectedOptions[0];if(o)o.textContent=t.name};
  $('#tW').onchange=e=>{t.w=Math.max(10,+e.target.value||t.w);up();renderLabels()};
  $('#tH').onchange=e=>{t.h=Math.max(5,+e.target.value||t.h);up();renderLabels()};
  $('#tBg').oninput=e=>{t.bg=e.target.value;up();redrawCanvas(t)};
  $('#tBorder').onchange=e=>{t.border=e.target.checked;up();redrawCanvas(t)};
  const add=o=>{const n=Object.assign({id:uid(),x:2,y:2,w:Math.min(30,t.w-4),h:8,fs:10,bold:false,align:'left',valign:'middle',upper:false,color:'#000000',text:''},o);t.elements.push(n);S.selEl=n.id;up();renderLabels()};
  $('#aText').onclick=()=>add({type:'text',text:'Text'});
  $('#aQR').onclick=()=>{const s=Math.min(t.h-4,20);add({type:'qr',qr:'spec',w:s,h:s})};
  $('#aField').onchange=e=>{if(e.target.value)add({type:'text',text:'{'+e.target.value+'}',bold:e.target.value==='PC No',fs:e.target.value==='PC No'?14:10})};
  m.querySelectorAll('.ellist .it').forEach(i=>i.onclick=()=>{S.selEl=i.dataset.el;renderLabels()});
  $('#pv').onchange=e=>{S.previewId=e.target.value;redrawCanvas(t)};
  $('#zm').oninput=e=>{S.zoom=+e.target.value;$('#cvIn').style.transform=`scale(${S.zoom})`;redrawCanvas(t)};
  $('#tPrint').onclick=()=>openPrint();
  $('#cv').addEventListener('pointerdown',e=>{if(!e.target.closest('.el')&&S.selEl){S.selEl=null;renderLabels()}});
  bindCanvas(t);
  if(!el)return;
  const p=$('#props');
  p.querySelectorAll('[data-p]').forEach(inp=>{
    const k=inp.dataset.p;
    const h=()=>{
      if(inp.type==='checkbox')el[k]=inp.checked;
      else if(inp.type==='number'){el[k]=+inp.value;if(el.type==='qr'&&(k==='w'||k==='h')){el.w=el.h=+inp.value;p.querySelector(`[data-p="${k==='w'?'h':'w'}"]`).value=inp.value}}
      else el[k]=inp.value;
      up();redrawCanvas(t);
      if(k==='qr')renderLabels();
      if(k==='text'){const it=m.querySelector(`.ellist .it[data-el="${el.id}"] .t`);if(it)it.textContent=el.text||'<empty>'}
    };
    inp.addEventListener(inp.tagName==='SELECT'||inp.type==='checkbox'?'change':'input',h);
  });
  p.querySelectorAll('[data-al]').forEach(b=>b.onclick=()=>{el.align=b.dataset.al;up();renderLabels()});
  p.querySelectorAll('[data-va]').forEach(b=>b.onclick=()=>{el.valign=b.dataset.va;up();renderLabels()});
  p.querySelectorAll('[data-ins]').forEach(c=>c.onclick=()=>{
    const ta=$('#pText');const ins='{'+c.dataset.ins+'}';const s=ta.selectionStart??ta.value.length;
    ta.value=ta.value.slice(0,s)+ins+ta.value.slice(ta.selectionEnd??s);ta.dispatchEvent(new Event('input'));ta.focus();ta.selectionStart=ta.selectionEnd=s+ins.length});
  $('#eDel').onclick=()=>{t.elements=t.elements.filter(x=>x!==el);S.selEl=null;up();renderLabels()};
  $('#eDup').onclick=()=>{const n=Object.assign({},el,{id:uid(),x:el.x+2,y:el.y+2});t.elements.push(n);S.selEl=n.id;up();renderLabels()};
}
document.addEventListener('keydown',e=>{
  if(S.tab!=='labels'||!S.selEl||$('#ov'))return;
  if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;
  const t=tpl(),el=t&&t.elements.find(x=>x.id===S.selEl);if(!el)return;
  const st=e.shiftKey?2:0.5,mv={ArrowLeft:['x',-st],ArrowRight:['x',st],ArrowUp:['y',-st],ArrowDown:['y',st]}[e.key];
  if(mv){e.preventDefault();el[mv[0]]=Math.round((el[mv[0]]+mv[1])*2)/2;persistTemplates();renderLabels()}
  else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();t.elements=t.elements.filter(x=>x!==el);S.selEl=null;persistTemplates();renderLabels()}
});

/* ================= ustawienia ================= */
function renderSettings(){
  $('#main').innerHTML=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px">
  <div class="card side">
    <h4>Google Sheets connection</h4>
    <label class="f">Apps Script web app URL (ends with /exec)<input type="url" id="sUrl" value="${esc(S.cfg.url)}" placeholder="https://script.google.com/macros/s/…/exec"></label>
    <label class="f">Token (same as in Code.gs)<input type="password" id="sTok" value="${esc(S.cfg.token)}"></label>
    <div class="row" style="flex:none"><button class="btn pri" id="sSave">Save and connect</button><button class="btn" id="sTest">Test connection</button>${S.cfg.url?'<button class="btn danger" id="sOff">Disconnect</button>':''}</div>
    <h4 style="margin-top:8px">QR codes</h4>
    <label class="f">Default QR content<select id="sQr">${[['spec','Full spec (text)'],['link','Link to this PC on the site'],['name','PC number only']].map(([v,l])=>`<option value="${v}" ${S.cfg.qrMode===v?'selected':''}>${l}</option>`).join('')}</select></label>
    <label class="f">Site address used in QR links (empty = this address)<input id="sLink" value="${esc(S.cfg.linkBase)}" placeholder="${esc(location.origin+location.pathname)}"></label>
    ${demo()?'<h4 style="margin-top:8px">Demo</h4><button class="btn sm" id="sReset" style="align-self:flex-start">Reset demo data</button>':''}
  </div>
  <div class="card side help">
    <h4>Connect the sheet (about 5 minutes)</h4>
    <ol>
      <li>Upload <code>EWC_PC_Inventory.xlsx</code> to Google Drive, open it and choose <b>File → Save as Google Sheets</b>. In the new sheet open <b>Extensions → Apps Script</b>.</li>
      <li>Replace everything there with the contents of <code>Code.gs</code>.</li>
      <li>Change <code>const TOKEN = '…'</code> to a long password of your own and save (Ctrl+S).</li>
      <li><b>Deploy → New deployment</b> → gear icon → <b>Web app</b>. Execute as: <b>Me</b>, Who has access: <b>Anyone</b> → Deploy → allow access.</li>
      <li>Copy the web app URL (ends with /exec), paste it here with the token and choose <b>Save and connect</b>.</li>
    </ol>
    <p class="muted">The site works on the <b>Inventory</b> tab and takes its dropdown lists from <b>Lists</b>. <b>Summary</b> keeps calculating in the sheet. The script adds <b>Updated</b>, <b>Updated by</b> and <b>ID</b> columns at the end of Inventory – leave them as they are. Everyone enters the URL and token on their own device.</p>
    <p class="muted">After changing the code in Apps Script: <b>Deploy → Manage deployments → edit → Version: New version</b>, otherwise the old version keeps running.</p>
  </div></div>`;
  const read=()=>{S.cfg.url=$('#sUrl').value.trim();S.cfg.token=$('#sTok').value;LS.set('ewc_cfg',S.cfg)};
  $('#sSave').onclick=async()=>{read();await load();if(!demo())toast('Connected to the sheet')};
  $('#sTest').onclick=async()=>{const old={...S.cfg};read();try{const j=await api('ping');toast(demo()?'No URL – demo mode':'Connected to '+j.sheet)}catch(e){toast('Connection failed: '+e.message,true)}};
  const off=$('#sOff');if(off)off.onclick=()=>{S.cfg.url='';LS.set('ewc_cfg',S.cfg);load()};
  $('#sQr').onchange=e=>{S.cfg.qrMode=e.target.value;LS.set('ewc_cfg',S.cfg)};
  $('#sLink').onchange=e=>{S.cfg.linkBase=e.target.value.trim();LS.set('ewc_cfg',S.cfg)};
  const rs=$('#sReset');if(rs)rs.onclick=()=>{try{localStorage.removeItem('ewc2_demo')}catch(e){}load();toast('Demo data reset')};
}

/* ================= router ================= */
function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  ({add:renderAdd,pcs:renderPcs,parts:renderParts,labels:renderLabels,settings:renderSettings}[S.tab])();
  document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.goto;render()});
}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});
$('#refresh').onclick=load;
function askUser(force){
  if(S.user&&!force){$('#whoName').textContent=S.user;return}
  modal(`<div class="mh"><h3>Who is using this device?</h3></div>
  <div class="mb"><label class="f">Your name – shown next to every change you make<input id="uName" value="${esc(S.user)}" maxlength="30"></label></div>
  <div class="mf"><button class="btn pri" id="uOk">Continue</button></div>`,ov=>{
    const i=ov.querySelector('#uName');setTimeout(()=>i.focus(),30);
    const ok=()=>{const v=i.value.trim();if(!v)return toast('Enter your name',true);S.user=v;LS.set('ewc_user',v);$('#whoName').textContent=v;closeModal()};
    ov.querySelector('#uOk').onclick=ok;i.onkeydown=e=>{if(e.key==='Enter')ok()};
  });
}
$('#who').onclick=()=>askUser(true);
load().then(()=>{const id=new URLSearchParams(location.search).get('id');if(id&&S.items.find(x=>x.ID===id))editInEntry(id);askUser(false)});
</script>
